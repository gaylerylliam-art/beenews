<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Newsroom · BeeNews</title>
<meta name="theme-color" content="#0f172a">
<link rel="icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/modern.css">
<link rel="stylesheet" href="/css/pages.css">
<link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin">
<header id="pgHead"></header>
<main class="pg-main wide" id="adMain">
  <div class="card-box ad-gate" id="adGate"><p>Loading…</p></div>
  <div id="adApp" hidden>
    <div class="ad-top">
      <h1><i class="fa-solid fa-newspaper" aria-hidden="true"></i> Newsroom</h1>
      <div class="ad-who"><span id="adWho"></span><button type="button" class="btn btn-ghost" id="adOut">Sign out</button></div>
    </div>
    <nav class="ad-tabs" id="adTabs" role="tablist">
      <button type="button" data-tab="queue" role="tab">Review queue <span class="cnt" id="cntQueue"></span></button>
      <button type="button" data-tab="candidates" role="tab">From feeds <span class="cnt" id="cntCand"></span></button>
      <button type="button" data-tab="stories" role="tab">All stories</button>
      <button type="button" data-tab="reports" role="tab">Reports <span class="cnt" id="cntRep"></span></button>
      <button type="button" data-tab="sources" role="tab">Sources</button>
      <button type="button" data-tab="health" role="tab">Usage &amp; errors</button>
      <button type="button" class="btn btn-amber ad-new" id="adNew"><i class="fa-solid fa-plus" aria-hidden="true"></i> New story</button>
    </nav>
    <section id="adView" aria-live="polite"></section>
  </div>
</main>
<dialog id="adDlg" class="bn-dialog ad-dlg"></dialog>
<div id="adToast" class="bn-toast" role="status" aria-live="polite" hidden></div>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/js/page.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
