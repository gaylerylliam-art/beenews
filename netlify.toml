# BeeNews on Netlify: a static site. The build only copies the web files into dist/
# (so the app projects, tools and node_modules are never published).
[build]
  publish = "dist"
  command = "node tools/build-www.mjs --web"
  edge_functions = "netlify/edge-functions"

# Pages, scripts and styles keep the same file names between releases,
# so browsers re-check them on every visit and always get the latest design.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Logos and icons rarely change: cache for a week.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# One page per story: /story/<id> is served by story.html (the edge function adds share previews).
[[redirects]]
  from = "/story/*"
  to = "/story.html"
  status = 200

# The editor dashboard must never be cached or indexed.
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"
